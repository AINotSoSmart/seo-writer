name: Deploy to Trigger.dev

on:
  push:
    branches:
      - main 
      
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 1. AUTHENTICATION (Must be the Personal Access Token, NOT the Secret Key)
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      
      # 2. PROJECT REFERENCE (From your Vercel Env/GitHub Secret)
      TRIGGER_PROJECT_ID: ${{ secrets.TRIGGER_PROJECT_ID }} 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm install

      - name: Deploy to Trigger.dev
        # The CLI refuses to deploy when its version differs from the pinned
        # @trigger.dev/sdk, so it is read from package.json rather than @latest
        # (which broke every deploy once 4.6.2 shipped).
        run: npx trigger.dev@$(node -p "require('./package.json').dependencies['@trigger.dev/sdk']") deploy --project-ref $TRIGGER_PROJECT_ID
